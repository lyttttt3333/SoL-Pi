name: PR35 Native Windows Validation
on:
  push:
    branches: [validation/pr35-windows]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
        pi: ['0.84.2', '0.85.1']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NVlabs/SoL-Pi
          ref: 2b791687a489a1d24da816cf1634d8ae1d36befd
          path: target
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Compare baseline and PR with real tools
        shell: pwsh
        run: node harness/validation/pr35/run.mjs target results '${{ matrix.pi }}'
      - name: Retain all results, including failing tests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr35-${{ matrix.os }}-pi-${{ matrix.pi }}
          path: results/
          if-no-files-found: error
